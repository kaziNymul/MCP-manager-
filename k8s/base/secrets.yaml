# NOTE: In production, use External Secrets Operator, Vault, or AWS Secrets Manager
# This file is a template - do not commit actual secrets!
apiVersion: v1
kind: Secret
metadata:
  name: mcp-manager-secrets
  namespace: mcp-manager
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://mcp_user:CHANGE_ME@postgres-primary:5432/mcp_manager?sslmode=require"
  
  # JWT Secret (generate with: openssl rand -base64 32)
  JWT_SECRET: "CHANGE_ME_generate_a_secure_256_bit_secret"
  
  # OIDC Configuration
  OIDC_ISSUER: "https://your-idp.okta.com"
  OIDC_CLIENT_ID: "mcp-manager-client"
  OIDC_CLIENT_SECRET: "CHANGE_ME"
  
  # GitHub App Configuration (for Copilot Enterprise sync)
  GITHUB_APP_ID: "12345"
  GITHUB_APP_INSTALLATION_ID: "67890"
  # Base64 encoded private key or path to mounted secret
  GITHUB_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    CHANGE_ME - paste your GitHub App private key here
    -----END RSA PRIVATE KEY-----
  
  # Optional: GitHub Enterprise URL (omit for github.com)
  GITHUB_ENTERPRISE_URL: "https://github.your-company.com"
  
  # Redis password (if using password auth)
  REDIS_PASSWORD: "CHANGE_ME"
