apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-manager
  namespace: mcp-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-manager-role
  namespace: mcp-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-manager-rolebinding
  namespace: mcp-manager
subjects:
  - kind: ServiceAccount
    name: mcp-manager
    namespace: mcp-manager
roleRef:
  kind: Role
  name: mcp-manager-role
  apiGroup: rbac.authorization.k8s.io
